name: Alias Submit / 别名模板提交
description: Submit an alias mapping from user/package to InstallerName.
title: "[Alias] <username>/<package> -> <InstallerName>"
labels:
  - alias-submit
body:
  - type: markdown
    attributes:
      value: |
        ## 提交自己的第三方别名模板！

        提交后，GitHub Actions 会自动生成 `alias/{首字母}/{user}/{InstallerName}.sque` 文件。
        合并后即可通过 `pier o user/InstallerName` 使用。

  - type: input
    id: username
    attributes:
      label: Username
      description: "你的用户名，作为命名空间使用，例如 `sanakaprix`。"
      placeholder: your-github-name
    validations:
      required: true

  - type: input
    id: installer_name
    attributes:
      label: InstallerName
      description: "目标包的 InstallerName(包名)，必须已经存在于软件源中。"
      placeholder: czadb
    validations:
      required: true

  - type: textarea
    id: default_open
    attributes:
      label: DefaultOpen (optional)
      description: "默认打开的程序名，支持通配符 `*` 和 `?`。"
      placeholder: |
        ADBTOOLS_*
        7zFM.exe

  - type: textarea
    id: aliases
    attributes:
      label: Alias commands (optional)
      description: "自定义命令别名，格式为 `alias: program arguments`。"
      placeholder: |
        connect: adb.exe connect
        i386: qemu-system-i386.exe -hda $1 -cdrom $2 -vnc :$3

  - type: markdown
    attributes:
      value: |
        ---
        ### 提交后

        Actions 会自动创建 PR，你只需要等待审核与合并。
        合并后即可通过 `pier o {username}/{InstallerName}` 使用。
