name: 别名提交 / Alias Submit
description: 提交第三方别名映射（user/package → InstallerName）
title: "[Alias] user/package → InstallerName"
labels: [alias-submit]
body:
  - type: markdown
    attributes:
      value: |
        ## 📦 提交别名映射

        提交后 GitHub Actions 会自动生成 `alias/{首字母}/{user}/{InstallerName}.sque` 文件。

        Pier 客户端通过 `pier o user/InstallerName` 使用。

  - type: input
    id: username
    attributes:
      label: 用户名 / Username
      description: 你的用户名（作为命名空间，如 `sanakaprix`）
      placeholder: "你的 GitHub 用户名"
    validations:
      required: true

  - type: input
    id: installer_name
    attributes:
      label: InstallerName
      description: 指向的包 InstallerName（已在软件源中存在的包名）
      placeholder: "czadb"
    validations:
      required: true

  - type: textarea
    id: default_open
    attributes:
      label: DefaultOpen（可选）
      description: 默认打开的程序名，支持通配符 `*` 和 `?`
      placeholder: |
        一行一个，例如：
        ADBTOOLS_*
        7zFM.exe
      render: textarea

  - type: textarea
    id: aliases
    attributes:
      label: Alias 命令别名（可选）
      description: 自定义命令别名，格式 `别名: 程序名 参数`
      placeholder: |
        一行一个，例如：
        connect: adb.exe connect
        install: adb.exe install
      render: textarea

  - type: markdown
    attributes:
      value: |
        ---
        ### 提交后

        Actions 会自动创建 PR，你只需等待审核合并即可。
        Pier 客户端次日即可通过 `pier o {username}/{InstallerName}` 使用。
