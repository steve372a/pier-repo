name: Pier Auto Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Database Files
        run: |
          # 1. 定义变量
          PIE_DIR="./sources"
          OUTPUT_FILE="./db.sque"
          DBM_FILE="./dbm.sque"
          TEMP_FILE="./db.tmp"
          EXTRACT_DIR="./temp_extract"

          # 2. 清理环境
          rm -f $OUTPUT_FILE $DBM_FILE $TEMP_FILE
          rm -rf $EXTRACT_DIR
          mkdir -p $EXTRACT_DIR
          touch $TEMP_FILE

          # 3. 遍历 sources/*/*.metadata 压缩包
          find "$PIE_DIR" -mindepth 2 -maxdepth 2 -name "*.metadata" -print0 | while IFS= read -r -d '' metafile; do
              
              # 为每个包创建独立的解压目录
              PKG_DIR="$EXTRACT_DIR/$(basename "$metafile" .metadata)"
              mkdir -p "$PKG_DIR"
              
              # 解压 .metadata 压缩包
              unzip -q "$metafile" -d "$PKG_DIR" 2>/dev/null || continue
              
              # 读取 metadata.sque
              METADATA_SQUE="$PKG_DIR/metadata.sque"
              if [ ! -f "$METADATA_SQUE" ]; then
                  echo "Warning: metadata.sque not found in $metafile" >&2
                  continue
              fi
              
              # 字段提取函数（保持原逻辑：GBK 编码）
              get_field() {
                  iconv -f GBK -t UTF-8//IGNORE "$METADATA_SQUE" | sed -n "/\[$1\]/{n;p;}" | tr -d '\r' | xargs | iconv -f UTF-8 -t GBK//IGNORE
              }

              # 获取字段
              pkgname=$(get_field "InstallerName")
              
              if [ -z "$pkgname" ]; then
                  pkgname=$(get_field "PackageName")
              fi
              if [ -z "$pkgname" ]; then
                  pkgname=$(basename -- "$metafile" .metadata | iconv -t GBK//IGNORE)
              fi
              
              version=$(get_field "Version")
              os_info=$(get_field "OS")
              profile=$(get_field "ProFile")
              inst_dir=$(get_field "InstallDir")

              # 保底处理
              [ -z "$version" ] && version="0.0.0"
              [ -z "$os_info" ] && os_info="XP"
              [ -z "$profile" ] && profile=$(echo "暂无描述" | iconv -f UTF-8 -t GBK)
              [ -z "$inst_dir" ] && inst_dir=""

              # 写入临时文件
              printf "%s | %s | %s | %s | %s\r\n" "$pkgname" "$version" "$os_info" "$profile" "$inst_dir" >> "$TEMP_FILE"
              
              # 清理临时解压目录
              rm -rf "$PKG_DIR"
          done

          # 4. 排序
          LC_ALL=C sort -V "$TEMP_FILE" -o "$OUTPUT_FILE"

          # 5. 生成统计文件
          count=$(wc -l < "$OUTPUT_FILE")
          printf "%d" "$count" > "$DBM_FILE"

          echo "Database update complete. Processed $count packages (GBK Mode)."
          rm -f $TEMP_FILE
          rm -rf $EXTRACT_DIR

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add db.sque dbm.sque
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: Update GBK database (metadata.sque from sources/*/*.metadata)"
            git push
          fi
