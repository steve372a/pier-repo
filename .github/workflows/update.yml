name: Pier Auto Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Database Files
        run: |
          # 1. 定义变量
          PIE_DIR="./sources"
          OUTPUT_FILE="./db.sque"
          DBM_FILE="./dbm.sque"
          TEMP_FILE="./db.tmp"
          EXTRACT_DIR="./temp_extract"

          # 2. 清理环境
          rm -f $OUTPUT_FILE $DBM_FILE $TEMP_FILE
          rm -rf $EXTRACT_DIR
          mkdir -p $EXTRACT_DIR
          touch $TEMP_FILE

          # 3. 遍历 sources/*/*.metadata 压缩包
          find "$PIE_DIR" -mindepth 2 -maxdepth 2 -name "*.metadata" -print0 | while IFS= read -r -d '' metafile; do
              
              PKG_DIR="$EXTRACT_DIR/$(basename "$metafile" .metadata)"
              mkdir -p "$PKG_DIR"
              
              unzip -q "$metafile" -d "$PKG_DIR" 2>/dev/null || continue
              
              METADATA_SQUE="$PKG_DIR/metadata.sque"
              if [ ! -f "$METADATA_SQUE" ]; then
                  echo "Warning: metadata.sque not found in $metafile" >&2
                  continue
              fi
              
              # 字段提取函数：智能识别编码
              get_field() {
                  local key=$1
                  # 提取目标行的下一行内容
                  local raw_val=$(sed -n "/\[$key\]/{n;p;}" "$METADATA_SQUE" | tr -d '\r' | xargs)
                  
                  # 验证是否为合法 UTF-8
                  if echo "$raw_val" | iconv -f UTF-8 -t UTF-8 >/dev/null 2>&1; then
                      echo "$raw_val"
                  else
                      # 如果不是 UTF-8，则尝试从 GBK 转换
                      echo "$raw_val" | iconv -f GBK -t UTF-8//IGNORE
                  fi
              }

              # 获取字段
              pkgname=$(get_field "InstallerName")
              [ -z "$pkgname" ] && pkgname=$(get_field "PackageName")
              [ -z "$pkgname" ] && pkgname=$(basename -- "$metafile" .metadata)
              
              version=$(get_field "Version")
              os_info=$(get_field "OS")
              profile=$(get_field "ProFile")
              inst_dir=$(get_field "InstallDir")

              # 保底处理
              [ -z "$version" ] && version="0.0.0"
              [ -z "$os_info" ] && os_info="XP"
              [ -z "$profile" ] && profile="暂无描述"
              [ -z "$inst_dir" ] && inst_dir=""

              # 写入临时文件 (UTF-8 格式)
              printf "%s | %s | %s | %s | %s\n" "$pkgname" "$version" "$os_info" "$profile" "$inst_dir" >> "$TEMP_FILE"
              
              rm -rf "$PKG_DIR"
          done

          # 4. 排序
          LC_ALL=C sort -V "$TEMP_FILE" -o "$OUTPUT_FILE"

          # 5. 生成统计文件
          count=$(wc -l < "$OUTPUT_FILE")
          printf "%d" "$count" > "$DBM_FILE"

          echo "Database update complete. Processed $count packages (UTF-8 Mode)."
          rm -f $TEMP_FILE
          rm -rf $EXTRACT_DIR

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add db.sque dbm.sque
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: Update UTF-8 database (Smart encoding detection)"
            git push
          fi
