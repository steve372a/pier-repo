name: Pier Auto Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Database Files
        run: |
          python3 <<'PY'
          import json
          import re
          import zipfile
          from pathlib import Path

          PIE_DIR = Path("./sources")
          OUTPUT_FILE = Path("./db.sque")
          DBM_FILE = Path("./dbm.sque")
          PACKAGES_FILE = Path("./packages.json")

          def decode_bytes(data: bytes) -> str:
              for encoding in ("utf-8", "gbk", "cp936"):
                  try:
                      return data.decode(encoding)
                  except UnicodeDecodeError:
                      continue
              return data.decode("utf-8", errors="replace")

          def parse_sections(text: str) -> dict[str, str]:
              normalized = text.replace("\r\n", "\n").replace("\r", "\n")
              lines = normalized.split("\n")
              sections: dict[str, str] = {}
              current = None
              buffer: list[str] = []

              def flush() -> None:
                  nonlocal buffer, current
                  if current is None:
                      return
                  sections[current] = "\n".join(buffer).strip("\n")

              for line in lines:
                  match = re.fullmatch(r"\[(.+?)\]", line.strip())
                  if match:
                      flush()
                      current = match.group(1)
                      buffer = []
                  elif current is not None:
                      buffer.append(line)

              flush()
              return sections

          def first_value(sections: dict[str, str], key: str) -> str:
              value = sections.get(key, "")
              for line in value.splitlines():
                  stripped = line.strip()
                  if stripped and stripped != "::end":
                      return stripped
              return ""

          def strip_end_marker(value: str) -> str:
              lines = []
              for line in value.splitlines():
                  if line.strip() == "::end":
                      break
                  lines.append(line)
              return "\n".join(lines).strip()

          def parse_locale_fields(text: str) -> dict[str, dict[str, str]]:
              locales = {}
              for locale, block in parse_sections(text).items():
                  fields = {}
                  current_key = None
                  buffer: list[str] = []

                  def flush() -> None:
                      nonlocal current_key, buffer
                      if current_key is None:
                          return
                      fields[current_key] = "\n".join(buffer).strip()

                  for raw_line in block.splitlines():
                      line = raw_line.rstrip()
                      if not line or line.strip() == "::end":
                          continue
                      if ":" in line:
                          key, value = line.split(":", 1)
                          if re.fullmatch(r"[A-Za-z][A-Za-z0-9]*", key.strip()):
                              flush()
                              current_key = key.strip()
                              buffer = [value.strip()]
                              continue
                      if current_key is not None:
                          buffer.append(line)

                  flush()
                  locales[locale] = fields
              return locales

          def parse_notice_locales(text: str) -> dict[str, str]:
              return {
                  locale: strip_end_marker(block)
                  for locale, block in parse_sections(text).items()
              }

          def parse_aliases(value: str) -> list[dict[str, str]]:
              aliases = []
              for line in strip_end_marker(value).splitlines():
                  stripped = line.strip()
                  if not stripped or ":" not in stripped:
                      continue
                  name, command = stripped.split(":", 1)
                  aliases.append({
                      "name": name.strip(),
                      "command": command.strip(),
                  })
              return aliases

          def parse_multiline_list(value: str) -> list[str]:
              return [
                  line.strip()
                  for line in strip_end_marker(value).splitlines()
                  if line.strip()
              ]

          packages = []
          db_lines = []

          for metafile in sorted(PIE_DIR.glob("*/*/latest.metadata")):
              try:
                  with zipfile.ZipFile(metafile) as archive:
                      names = archive.namelist()
                      metadata_name = next((name for name in names if name.endswith("metadata.sque")), None)
                      profile_name = next((name for name in names if name.endswith("profile.sque")), None)
                      notice_name = next((name for name in names if name.endswith("notice.sque")), None)

                      if metadata_name is None:
                          print(f"Warning: metadata.sque not found in {metafile}")
                          continue

                      metadata_text = decode_bytes(archive.read(metadata_name))
                      profile_text = decode_bytes(archive.read(profile_name)) if profile_name else ""
                      notice_text = decode_bytes(archive.read(notice_name)) if notice_name else ""
              except zipfile.BadZipFile:
                  print(f"Warning: invalid metadata zip: {metafile}")
                  continue

              normalized_text = metadata_text.replace("\r\n", "\n").replace("\r", "\n").strip()
              normalized_profile_text = profile_text.replace("\r\n", "\n").replace("\r", "\n").strip()
              normalized_notice_text = notice_text.replace("\r\n", "\n").replace("\r", "\n").strip()
              sections = parse_sections(normalized_text)
              profile_locales = parse_locale_fields(normalized_profile_text) if normalized_profile_text else {}
              notice_locales = parse_notice_locales(normalized_notice_text) if normalized_notice_text else {}

              package_dir = metafile.parent.name
              installer_name = first_value(sections, "InstallerName") or package_dir
              package_name = first_value(sections, "PackageName") or installer_name
              version = first_value(sections, "Version") or "0.0.0"
              os_info = first_value(sections, "OS") or "XP"
              profile = first_value(sections, "ProFile") or "暂无描述"
              author = first_value(sections, "Author")
              distributor = first_value(sections, "Distributor")
              package_size = first_value(sections, "PackageSize")
              default_open = parse_multiline_list(sections.get("DefaultOpen", ""))
              aliases = parse_aliases(sections.get("Alias", ""))
              metadata_notice = strip_end_marker(sections.get("Notice", ""))

              localized_names = {
                  locale: fields["PackageName"]
                  for locale, fields in profile_locales.items()
                  if fields.get("PackageName")
              }
              localized_profiles = {
                  locale: fields["ProFile"]
                  for locale, fields in profile_locales.items()
                  if fields.get("ProFile")
              }

              package = {
                  "id": installer_name,
                  "name": package_name,
                  "version": version,
                  "os": os_info,
                  "profile": profile,
                  "author": author,
                  "distributor": distributor,
                  "packageSize": package_size,
                  "defaultOpen": default_open,
                  "aliases": aliases,
                  "notice": metadata_notice,
                  "localizedNames": localized_names,
                  "profiles": localized_profiles,
                  "notices": notice_locales,
                  "metadataFields": sections,
                  "metadataText": normalized_text,
                  "profileText": normalized_profile_text,
                  "noticeText": normalized_notice_text,
              }
              packages.append(package)
              db_lines.append(
                  f"{installer_name} | {version} | {os_info} | {profile} | "
              )

          packages.sort(key=lambda item: (item["id"].casefold(), item["version"]))
          db_lines.sort(key=str.casefold)

          OUTPUT_FILE.write_text("\n".join(db_lines) + ("\n" if db_lines else ""), encoding="utf-8")
          DBM_FILE.write_text(str(len(packages)), encoding="utf-8")
          PACKAGES_FILE.write_text(
              json.dumps(packages, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Database update complete. Processed {len(packages)} packages.")
          PY

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add db.sque dbm.sque packages.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: Update package indexes"
            git push
          fi
