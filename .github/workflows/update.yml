name: Pier Auto Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Database Files
        run: |
          # 1. 定义变量
          PIE_DIR="./sources"
          TEMP_FILE="./db.tmp"
          OUTPUT_FILE="./db.sque"
          DBM_FILE="./dbm.sque"

          # 2. 清理环境
          rm -f $TEMP_FILE $OUTPUT_FILE $DBM_FILE
          touch $TEMP_FILE

          # 3. 遍历元数据文件
          find "$PIE_DIR" -maxdepth 1 -name "*.metadata" -print0 | while IFS= read -r -d '' metafile; do
              
              # 提取字段逻辑
              pkgname=$(sed -n '/\[PackageName\]/{n;p;}' "$metafile" | tr -d '\r' | xargs)
              if [ -z "$pkgname" ]; then
                  pkgname=$(basename -- "$metafile" .metadata)
              fi
              
              version=$(sed -n '/\[Version\]/{n;p;}' "$metafile" | tr -d '\r' | xargs)
              os_info=$(sed -n '/\[OS\]/{n;p;}' "$metafile" | tr -d '\r' | xargs)
              profile=$(sed -n '/\[ProFile\]/{n;p;}' "$metafile" | tr -d '\r' | xargs)
              # 新增：提取 InstallDir
              inst_dir=$(sed -n '/\[InstallDir\]/{n;p;}' "$metafile" | tr -d '\r' | xargs)

              # 保底处理
              [ -z "$version" ] && version="0.0.0"
              [ -z "$os_info" ] && os_info="XP"
              [ -z "$profile" ] && profile="暂无描述"
              [ -z "$inst_dir" ] && inst_dir="\"\"" # 如果为空，填入空字符串标识

              # 写入临时文件 (包名 | 版本 | 兼容系统 | 简介 | 安装目录)
              printf "%s | %s | %s | %s | %s\r\n" "$pkgname" "$version" "$os_info" "$profile" "$inst_dir" >> "$TEMP_FILE"
          done

          # 4. 自然排序
          sort -V "$TEMP_FILE" -o "$TEMP_FILE"

          # 5. 编码转换：UTF-8 -> GBK
          iconv -f UTF-8 -t GBK//IGNORE "$TEMP_FILE" -o "$OUTPUT_FILE"

          # 6. 生成统计文件
          count=$(wc -l < "$TEMP_FILE")
          printf "%d" "$count" > "$DBM_FILE"

          echo "Database update complete. Total: $count packages."
          rm -f $TEMP_FILE

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add db.sque dbm.sque
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: Update database indices (5 fields, GBK)"
            git push
          fi