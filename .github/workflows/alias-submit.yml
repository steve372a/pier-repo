name: Process Alias Submit

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-alias:
    if: contains(github.event.issue.labels.*.name, 'alias-submit') || startsWith(github.event.issue.title, '[Alias]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            const getField = (label) => {
              const re = new RegExp(`### ${label}[\\s\\S]*?\\n\\n([\\s\\S]*?)(?=\\n### |\\n---|$)`);
              const match = body.match(re);
              return match ? match[1].trim() : '';
            };

            const username = getField('Username');
            const installerName = getField('InstallerName');
            const defaultOpen = getField('DefaultOpen \\(optional\\)');
            const aliases = getField('Alias commands \\(optional\\)');

            if (!username || !installerName) {
              core.setFailed('Missing required fields: username or installerName');
              return;
            }

            if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
              core.setFailed('Invalid username: only letters, numbers, hyphens and underscores allowed');
              return;
            }

            if (!/^[a-zA-Z0-9_-]+$/.test(installerName)) {
              core.setFailed('Invalid installerName: only letters, numbers, hyphens and underscores allowed');
              return;
            }

            const firstLetter = username[0].toLowerCase();
            let content = `[ToUse]\n${installerName}\n\n`;

            if (defaultOpen) {
              content += `[DefaultOpen]\n${defaultOpen}\n::end\n\n`;
            } else {
              content += `[DefaultOpen]\n::end\n\n`;
            }

            if (aliases) {
              content += `[Alias]\n${aliases}\n::end\n`;
            } else {
              content += `[Alias]\n::end\n`;
            }

            const filePath = `alias/${firstLetter}/${username}/${installerName}.sque`;

            core.setOutput('file_path', filePath);
            core.setOutput('file_content', content);
            core.setOutput('username', username);
            core.setOutput('installer_name', installerName);

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Processing alias submission...\n\nPath: \`${filePath}\`\n\n\`\`\`ini\n${content}\n\`\`\``
            });

      - name: Create alias file and commit
        id: commit
        env:
          FILE_PATH: ${{ steps.parse.outputs.file_path }}
          FILE_CONTENT: ${{ steps.parse.outputs.file_content }}
          USERNAME: ${{ steps.parse.outputs.username }}
          INSTALLER_NAME: ${{ steps.parse.outputs.installer_name }}
        run: |
          mkdir -p "$(dirname "$FILE_PATH")"
          echo "$FILE_CONTENT" > "$FILE_PATH"

          if git ls-files --error-unmatch "$FILE_PATH" 2>/dev/null; then
            echo "file_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "file_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Add alias: ${{ steps.parse.outputs.username }}/${{ steps.parse.outputs.installer_name }}"
          title: "Add alias: ${{ steps.parse.outputs.username }}/${{ steps.parse.outputs.installer_name }}"
          body: |
            ## Alias Submission

            Auto-generated from Issue #${{ github.event.issue.number }}.

            | Field | Value |
            |------|-----|
            | Username | `${{ steps.parse.outputs.username }}` |
            | InstallerName | `${{ steps.parse.outputs.installer_name }}` |
            | File path | `${{ steps.parse.outputs.file_path }}` |

            Pier usage: `pier o ${{ steps.parse.outputs.username }}/${{ steps.parse.outputs.installer_name }}`
          branch: "alias/${{ steps.parse.outputs.username }}/${{ steps.parse.outputs.installer_name }}"
          delete-branch: true

      - name: Update issue with PR info
        if: steps.pr.outcome == 'success' && steps.pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = `${{ steps.pr.outputs.pull-request-number }}`;
            const prUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`;
            const filePath = `${{ steps.parse.outputs.file_path }}`;
            const fileExists = `${{ steps.commit.outputs.file_exists }}`;

            let body = `Created PR [#${prNumber}](${prUrl})\n\n`;
            body += `File: \`${filePath}\`\n\n`;

            if (fileExists === 'true') {
              body += `Warning: this file already exists in the repository. The PR will overwrite the current content.\n\n`;
            }

            body += `It will take effect after review and merge.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Report PR creation failure
        if: steps.pr.outcome == 'failure' || steps.pr.outputs.pull-request-number == ''
        uses: actions/github-script@v7
        with:
          script: |
            let body = 'The alias file was generated, but no pull request was created.\n\n';
            body += 'Common causes:\n';
            body += '- `Settings -> Actions -> General -> Workflow permissions` is not set to allow write access.\n';
            body += '- `Allow GitHub Actions to create and approve pull requests` is disabled.\n';
            body += '- There was no diff to commit because the target file already matched the generated content.\n';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
